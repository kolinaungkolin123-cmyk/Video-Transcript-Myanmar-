<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnexClip Admin</title><script src="config.js"></script>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#1d2030;--mut:#6b7185;--pri:#5b5bf0;--bd:#dfe2ec;--ok:#12a150;--er:#d93025;--wn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e2b;--tx:#eceef6;--mut:#9aa0b8;--bd:#2d3146;--pri:#8a8aff;--wn:#e0a84a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Myanmar",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{padding:11px 14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.t{width:auto;background:transparent;font-size:1.2rem;padding:4px 8px;margin:0}
.er{color:var(--er)}.ok{color:var(--ok)}.wn{color:var(--wn)}label{font-size:.85rem;color:var(--mut)}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{margin:0}.tabs button:not(.on){background:transparent;color:var(--mut);border:1px solid var(--bd)}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.it>div{flex:1}.pn{display:none}.pn.on{display:block}
</style></head><body><main><h2>🔐 Admin</h2>
<div class="card" id="lg"><label>Admin Password</label><input id="pw" type="password"><button id="lb">ဝင်မည်</button><div id="lm" style="margin-top:8px"></div></div>
<div id="app" style="display:none">
<div class="tabs"><button class="on" data-t="0">ထည့်ပေးမည်</button><button data-t="1">History</button><button data-t="2">User Send</button></div>
<div class="pn on" id="p0"><div class="card"><label>၁။ User ID</label><input id="gu" inputmode="numeric"><label>၂။ Video အပုဒ်ရေ</label><input id="gn" inputmode="numeric">
<button id="gb">၃။ သက်မှတ်မည်</button><div id="gm" style="margin-top:8px;font-weight:700"></div></div></div>
<div class="pn" id="p1"><div class="card" id="hl"></div></div>
<div class="pn" id="p2"><div class="card" id="ol"></div></div></div></main>
<script>
const A=((window.CFG||{}).API||"").replace(/\/$/,""),$=i=>document.getElementById(i),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");let pw="";
const F=(p,b)=>fetch(A+p,{method:b?"POST":"GET",headers:Object.assign({"X-Admin":pw},b?{"Content-Type":"application/json"}:{}),body:b?JSON.stringify(b):undefined});
$("lb").onclick=async()=>{pw=$("pw").value;$("lm").className="";$("lm").textContent="စစ်နေသည်...";
  try{const r=await F("/api/admin/login",{});if(r.ok){$("lg").style.display="none";$("app").style.display="block";loadAll()}else{$("lm").className="er";$("lm").textContent="❌ Password မှားနေပါတယ်"}}
  catch(e){$("lm").className="er";$("lm").textContent="❌ Network Error"}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));for(let i=0;i<3;i++)$("p"+i).classList.toggle("on",i==b.dataset.t);loadAll()};
$("gb").onclick=async()=>{const m=$("gm");m.className="er";m.textContent="";
  try{const r=await F("/api/admin/grant",{uid:$("gu").value.trim(),n:$("gn").value.trim()});const j=await r.json();
    if(r.ok){m.className="ok";m.textContent="✅ အောင်မြင်ပါတယ် (ကျန်ရှိ "+j.left+" ပုဒ်)";$("gn").value="";loadAll()}else m.textContent="❌ မအောင်မြင်ပါ – "+(j.error||"")}catch(e){m.textContent="❌ Network Error"}};
async function loadAll(){
  try{const s=await (await F("/api/admin/sends")).json();
    $("hl").innerHTML=s.items.length?s.items.map(x=>'<div class="it"><div><b>'+esc(x.uid)+'</b> · +'+x.n+' ပုဒ်<br><small class="wn">ကျန် '+x.left+' ပုဒ် · '+new Date(x.t*1000).toLocaleString()+'</small></div><button class="t" data-u="'+esc(x.uid)+'">🗑</button></div>').join(""):'<div class="wn">မရှိသေးပါ</div>';
    $("hl").querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{if(confirm(b.dataset.u+" ရဲ့ video အရေအတွက် အကုန်ဖျက်မလား?")){await F("/api/admin/del",{uid:b.dataset.u});loadAll()}});
    const o=await (await F("/api/admin/orders")).json();
    $("ol").innerHTML=o.items.length?o.items.map(x=>'<div class="it" style="align-items:flex-start"><div><b>'+esc(x.uid)+'</b> · Video '+x.n+' ပုဒ် · '+esc(x.pay)+'<br>📞 '+esc(x.contact)+'<br><small class="wn">'+new Date(x.t*1000).toLocaleString()+'</small><br><a href="'+A+'/api/admin/img/'+x.oid+'?a='+encodeURIComponent(pw)+'" target="_blank">🧾 ပြေစာကြည့်</a></div><div><button class="sec" data-f="'+esc(x.uid)+'|'+x.n+'">ဖြည့်</button><button data-o="'+x.oid+'" style="'+(x.st=="done"?"background:var(--ok)":"")+'">'+(x.st=="done"?"✅ ပြီး":"ပြီးပြီ")+'</button></div></div>').join(""):'<div class="wn">Order မရှိသေးပါ</div>';
    $("ol").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const[u,n]=b.dataset.f.split("|");$("gu").value=u;$("gn").value=n;document.querySelector('.tabs button[data-t="0"]').click()});
    $("ol").querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{await F("/api/admin/order_done",{oid:b.dataset.o});loadAll()});
  }catch(e){}}
</script></body></html>
